[tool.ruff]
# Длина строки по стандарту
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W - ошибки/предупреждения PEP8, F - Pyflakes, I - isort (сортировка импортов), B - bugbear (поиск багов)
select = ["E", "W", "F", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true  # Требовать аннотацию типов для всех функций
ignore_missing_imports = true