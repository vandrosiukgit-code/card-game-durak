# Конфигурация Aider для проекта card-game-durak.
# Автоматически подгружает правила проекта в каждую сессию.

# Основные настройки поведения
suggest-shell-commands: true
shell-command-confirm: true
auto-test: false

# Режим архитектора (обсуждение перед правками)
architect: true

# Автоматическое согласие на интерактивные запросы (добавление файлов и т.д.)
yes-always: true

# Коммиты: не коммитить автоматически (см. CONVENTIONS.md §5)
auto-commits: false

# Линтер и тесты: aider не запускает их сам, только предлагает
lint-cmd: "ruff check --fix"
test-cmd: "pytest"

# Язык общения
chat-language: russian

# Автозагрузка правил проекта
read:
  - CONVENTIONS.md
  - VISION.md
  - PODKIDNOY_DURAK_RULES.md
